name: sync prints archive
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prints archive
        run: |
          curl -sO https://prints.wtf/archive/sync.mjs
          node sync.mjs https://prints.wtf/archive/ .
      - name: Commit changes
        run: |
          git config user.name "prints-sync"
          git config user.email "sync@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "sync $(date -u +%FT%TZ)"
          git push
